<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Labs | Capability Wiki</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1115;
            --panel: #181b21;
            --border: #2a2e36;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #3b82f6;
            --ok: #10b981;
            --warn: #f59e0b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Inter, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }
        header h1 { margin: 0; font-size: 18px; font-weight: 600; }
        header .sub {
            margin: 4px 0 0;
            font-size: 12px;
            color: var(--muted);
        }
        header nav a {
            color: var(--muted);
            text-decoration: none;
            margin-left: 16px;
            font-size: 13px;
        }
        header nav a:hover,
        header nav a.active { color: var(--accent); }
        .layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: calc(100vh - 73px);
        }
        .sidebar {
            border-right: 1px solid var(--border);
            background: var(--panel);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: calc(100vh - 73px);
            overflow: hidden;
        }
        .sidebar label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin-bottom: 6px;
        }
        select, input[type="search"] {
            width: 100%;
            background: #13151a;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 13px;
        }
        .comp-list {
            flex: 1;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .comp-item {
            text-align: left;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            color: var(--text);
            padding: 8px 10px;
            cursor: pointer;
            font-size: 12px;
        }
        .comp-item:hover { border-color: var(--border); background: #13151a; }
        .comp-item.active {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.12);
        }
        .comp-item .name { font-weight: 600; display: block; }
        .comp-item .meta {
            color: var(--muted);
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
            margin-top: 2px;
        }
        .badge {
            display: inline-block;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--muted);
            margin-left: 6px;
            vertical-align: middle;
        }
        .badge.on-bench { color: var(--ok); border-color: rgba(16, 185, 129, 0.4); }
        .badge.library { color: var(--muted); }
        main {
            padding: 20px 24px 40px;
            overflow: auto;
            max-height: calc(100vh - 73px);
        }
        .empty {
            color: var(--muted);
            font-size: 13px;
        }
        .detail-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 10px 16px;
            margin-bottom: 16px;
        }
        .detail-header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }
        .detail-header code {
            font-family: "JetBrains Mono", monospace;
            font-size: 12px;
            color: var(--muted);
        }
        .section {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .section h3 {
            margin: 0 0 10px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        th, td {
            text-align: left;
            padding: 8px 6px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }
        th { color: var(--muted); font-weight: 500; }
        .mono {
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
        }
        .snippet {
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
            background: #13151a;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 8px;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0;
        }
        button.copy {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }
        button.copy:hover { border-color: var(--accent); color: var(--accent); }
        button.copy.copied { border-color: var(--ok); color: var(--ok); }
        .pill-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .pill {
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #13151a;
            color: var(--text);
        }
        .pill.ro { color: var(--muted); }
        .connect-hint {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 14px;
        }
        .connect-hint code {
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
            color: var(--text);
        }
        .sidebar-tabs {
            display: flex;
            gap: 6px;
        }
        .sidebar-tabs button {
            flex: 1;
            background: #13151a;
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .sidebar-tabs button.active {
            color: var(--text);
            border-color: var(--accent);
        }
        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar {
                max-height: none;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .comp-list { max-height: 220px; }
            main { max-height: none; }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1><a href="/" style="color:inherit;text-decoration:none">Cloud Labs</a> · Wiki</h1>
            <p class="sub">Live tunables, measurables, parameters, and edge kernels — copy SDK handles</p>
        </div>
        <nav>
            <a href="/twin">Twin UI</a>
            <a href="/operations">Operations</a>
            <a href="/catalog">Catalog</a>
            <a href="/wiki" class="active">Wiki</a>
            <a href="/debug" target="_blank">Debugger</a>
        </nav>
    </header>
    <div class="layout">
        <aside class="sidebar">
            <div>
                <label for="backend-select">Backend</label>
                <select id="backend-select"></select>
            </div>
            <div class="sidebar-tabs">
                <button type="button" id="tab-components" class="active">Components</button>
                <button type="button" id="tab-kernels">Kernels</button>
            </div>
            <div id="components-pane">
                <div>
                    <label for="comp-filter">Components</label>
                    <input id="comp-filter" type="search" placeholder="Filter by tag, name, type…" />
                </div>
                <div id="comp-list" class="comp-list" style="margin-top:12px">
                    <div class="empty">Loading…</div>
                </div>
            </div>
            <div id="kernels-pane" hidden>
                <div id="kernel-list" class="comp-list">
                    <div class="empty">Loading…</div>
                </div>
            </div>
        </aside>
        <main id="detail">
            <div class="empty">Select a backend and component to inspect its capability contract.</div>
        </main>
    </div>
    <script type="module" src="/static/js/wiki/dashboard.js"></script>
</body>
</html>
