<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Labs | Wiki</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0e14;
            --panel: rgba(24, 27, 33, 0.78);
            --panel-solid: #181b21;
            --border: #2a2e36;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --accent-deep: #0ea5e9;
            --ok: #10b981;
            --warn: #f59e0b;
            --code-bg: #13151a;
            --motion: 0.22s;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Inter, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            position: relative;
        }
        .wiki-atmosphere {
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 55% 40% at 12% 8%, rgba(56, 189, 248, 0.16), transparent 55%),
                radial-gradient(ellipse 45% 35% at 88% 18%, rgba(14, 165, 233, 0.1), transparent 50%),
                radial-gradient(ellipse 50% 40% at 70% 90%, rgba(51, 65, 85, 0.35), transparent 55%),
                linear-gradient(180deg, #0a0e14 0%, #0f141c 50%, #0a0e14 100%);
            animation: atmosphereDrift 20s ease-in-out infinite alternate;
        }
        @keyframes atmosphereDrift {
            from { transform: translate3d(0, 0, 0) scale(1); }
            to { transform: translate3d(-1.5%, 1%, 0) scale(1.03); }
        }
        header {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 24px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.14);
            background: linear-gradient(180deg, rgba(24, 27, 33, 0.92), rgba(15, 17, 21, 0.75));
            backdrop-filter: blur(10px);
        }
        header h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
        header .sub {
            margin: 3px 0 0;
            font-size: 12px;
            color: var(--muted);
            max-width: 440px;
            line-height: 1.45;
        }
        header nav a {
            color: var(--muted);
            text-decoration: none;
            margin-left: 16px;
            font-size: 13px;
            transition: color var(--motion);
        }
        header nav a:hover,
        header nav a.active { color: var(--accent); }
        .section-bar {
            position: relative;
            z-index: 2;
            display: flex;
            gap: 8px;
            padding: 10px 24px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.12);
            background: linear-gradient(90deg, rgba(14, 165, 233, 0.06), transparent 40%, rgba(56, 189, 248, 0.05));
            flex-wrap: wrap;
            align-items: center;
        }
        .section-btn {
            background: rgba(15, 17, 21, 0.45);
            border: 1px solid rgba(148, 163, 184, 0.22);
            color: var(--muted);
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: color var(--motion), border-color var(--motion), background var(--motion), transform var(--motion);
        }
        .section-btn:hover {
            color: var(--text);
            border-color: rgba(56, 189, 248, 0.35);
            transform: translateY(-1px);
        }
        .section-btn.active {
            color: #e0f2fe;
            border-color: rgba(56, 189, 248, 0.55);
            background: rgba(14, 165, 233, 0.2);
            box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.12);
        }
        .layout {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: calc(100vh - 110px);
        }
        .sidebar {
            border-right: 1px solid rgba(148, 163, 184, 0.14);
            background: rgba(24, 27, 33, 0.62);
            backdrop-filter: blur(12px);
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: calc(100vh - 110px);
            overflow: hidden;
            scrollbar-color: #3a4050 transparent;
        }
        .sidebar::-webkit-scrollbar { width: 8px; }
        .sidebar::-webkit-scrollbar-thumb {
            background: #3a4050;
            border-radius: 4px;
        }
        .sidebar label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin-bottom: 6px;
            font-weight: 500;
        }
        select, input[type="search"] {
            width: 100%;
            background: var(--code-bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 13px;
        }
        .sidebar-tabs {
            display: flex;
            gap: 6px;
        }
        .sidebar-tabs button {
            flex: 1;
            background: var(--code-bg);
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 6px;
            padding: 7px 8px;
            cursor: pointer;
            font-size: 12px;
        }
        .sidebar-tabs button.active {
            color: var(--text);
            border-color: var(--accent);
        }
        .comp-list {
            flex: 1;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
            scrollbar-color: #3a4050 transparent;
        }
        .comp-list::-webkit-scrollbar { width: 8px; }
        .comp-list::-webkit-scrollbar-thumb {
            background: #3a4050;
            border-radius: 4px;
        }
        .comp-item {
            text-align: left;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            color: var(--text);
            padding: 8px 10px;
            cursor: pointer;
            font-size: 12px;
        }
        .comp-item:hover { border-color: var(--border); background: #13151a; }
        .comp-item.active {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.12);
        }
        .comp-item .name { font-weight: 600; display: block; }
        .comp-item .meta {
            color: var(--muted);
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
            margin-top: 2px;
        }
        .guide-item {
            text-align: left;
            background: transparent;
            border: 1px solid transparent;
            border-left: 3px solid transparent;
            border-radius: 0 8px 8px 0;
            color: #cbd5e1;
            padding: 9px 10px 9px 12px;
            cursor: pointer;
            font-size: 13.5px;
            line-height: 1.35;
            font-weight: 400;
            opacity: 0;
            transform: translateX(-6px);
            animation: chapterIn 0.35s ease forwards;
            transition: background var(--motion), color var(--motion), border-color var(--motion);
        }
        @keyframes chapterIn {
            to { opacity: 1; transform: translateX(0); }
        }
        .guide-item:hover {
            background: rgba(19, 21, 26, 0.85);
            color: var(--text);
        }
        .guide-item.active {
            border-left-color: var(--accent);
            background: rgba(14, 165, 233, 0.14);
            color: #f8fafc;
            font-weight: 600;
            box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.12);
        }
        .badge {
            display: inline-block;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--muted);
            margin-left: 6px;
            vertical-align: middle;
        }
        .badge.on-bench { color: var(--ok); border-color: rgba(16, 185, 129, 0.4); }
        .badge.library { color: var(--warn); border-color: rgba(245, 158, 11, 0.35); }
        main#detail {
            padding: 32px 36px 72px;
            overflow: auto;
            max-height: calc(100vh - 110px);
            scrollbar-color: #3a4050 transparent;
            background: linear-gradient(180deg, rgba(10, 14, 20, 0.15), rgba(10, 14, 20, 0.45));
        }
        main#detail::-webkit-scrollbar { width: 10px; }
        main#detail::-webkit-scrollbar-thumb {
            background: #3a4050;
            border-radius: 5px;
        }
        .empty { color: var(--muted); font-size: 13px; }
        .detail-header h2 { margin: 0 0 6px; font-size: 22px; }
        .detail-header code { font-size: 12px; color: var(--muted); margin-right: 8px; }
        .connect-hint { font-size: 13px; color: var(--muted); line-height: 1.5; }
        .section { margin-top: 22px; }
        .section h3 {
            margin: 0 0 10px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
        }
        .primitive-chip-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .primitive-chip {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.35);
            background: rgba(14, 165, 233, 0.1);
            color: #e0f2fe;
            font-family: "JetBrains Mono", monospace;
            font-size: 11.5px;
            line-height: 1.2;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        th, td {
            border-bottom: 1px solid var(--border);
            padding: 8px 6px;
            text-align: left;
            vertical-align: top;
        }
        th { color: var(--muted); font-weight: 500; }
        .mono { font-family: "JetBrains Mono", monospace; font-size: 11px; }
        pre.snippet {
            margin: 0;
            padding: 12px 14px;
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: "JetBrains Mono", monospace;
            font-size: 12px;
            overflow: auto;
            white-space: pre-wrap;
        }
        button.copy {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 11px;
        }
        button.copy.copied { color: var(--ok); border-color: rgba(16, 185, 129, 0.45); }

        /* Learn articles */
        .guide-article {
            max-width: 48rem;
            margin: 0 auto;
            font-family: Inter, system-ui, sans-serif;
            font-size: 15px;
            line-height: 1.68;
            color: #d5dee9;
            animation: articleIn 0.4s ease;
        }
        @keyframes articleIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .guide-article h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 16px;
            line-height: 1.25;
            color: #f8fafc;
            letter-spacing: -0.03em;
        }
        .guide-article h2 {
            font-size: 16px;
            font-weight: 650;
            margin: 28px 0 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.16);
            color: #f1f5f9;
            letter-spacing: 0.01em;
        }
        .guide-article h3 {
            font-size: 14px;
            font-weight: 600;
            margin: 20px 0 8px;
            text-transform: none;
            letter-spacing: 0;
            color: #e2e8f0;
        }
        .guide-article p { margin: 0 0 15px; }
        .guide-article ul,
        .guide-article ol {
            margin: 0 0 16px;
            padding-left: 1.5em;
        }
        .guide-article ul { list-style: disc; }
        .guide-article ol { list-style: decimal; }
        .guide-article li { margin-bottom: 8px; padding-left: 2px; }
        .guide-article li::marker { color: var(--accent); }
        .guide-article strong { color: #f8fafc; font-weight: 600; }
        .guide-article em { font-style: italic; color: #e2e8f0; }
        .guide-article a { color: var(--accent); text-decoration: none; }
        .guide-article a:hover { text-decoration: underline; }
        .guide-article table {
            margin: 12px 0 20px;
            font-size: 13px;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        .guide-article th {
            background: rgba(24, 27, 33, 0.8);
            padding: 10px 12px;
        }
        .guide-article td { padding: 10px 12px; }
        .guide-article code {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.86em;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 4px;
            padding: 1px 6px;
            color: #bfdbfe;
        }
        .guide-article pre {
            margin: 0 0 16px;
            padding: 14px 16px;
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: "JetBrains Mono", monospace;
            font-size: 12.5px;
            overflow: auto;
            white-space: pre-wrap;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .guide-article pre code {
            background: none;
            border: none;
            padding: 0;
            color: inherit;
            font-size: inherit;
        }
        .guide-figure {
            display: block;
            width: 100%;
            max-width: 40rem;
            height: auto;
            margin: 8px 0 6px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--code-bg);
        }
        svg.guide-figure {
            /* Inline SVG inherits the same frame as img figures */
            overflow: hidden;
        }
        .guide-article img.guide-figure + p,
        .guide-article svg.guide-figure + p {
            margin: 0 0 20px;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.45;
            max-width: 40rem;
        }
        .guide-nav {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 40px;
            padding-top: 18px;
            border-top: 1px solid rgba(148, 163, 184, 0.16);
        }
        .guide-nav button {
            background: rgba(15, 17, 21, 0.55);
            border: 1px solid rgba(148, 163, 184, 0.28);
            color: var(--text);
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 13px;
            font-family: Inter, sans-serif;
            transition: border-color var(--motion), color var(--motion), background var(--motion), transform var(--motion);
        }
        .guide-nav button:hover:not(:disabled) {
            border-color: rgba(56, 189, 248, 0.45);
            color: #f8fafc;
            background: rgba(14, 165, 233, 0.12);
            transform: translateY(-1px);
        }
        .guide-nav button:disabled {
            opacity: 0.35;
            cursor: default;
        }
        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar { max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
            .comp-list { max-height: 220px; }
            main#detail { max-height: none; }
            .backend-card-grid { grid-template-columns: 1fr; }
            .backend-hero { grid-template-columns: 1fr; }
            .backend-catalog-layout { grid-template-columns: 1fr; }
        }

        /* —— Backends hub (lively) —— */
        #backends-hub {
            position: relative;
            z-index: 1;
            min-height: calc(100vh - 110px);
            overflow: hidden;
        }
        #backends-hub[hidden] { display: none !important; }
        .backends-atmosphere {
            display: none; /* page-level .wiki-atmosphere covers Learn + Backends */
        }
        .backends-hub-inner {
            position: relative;
            z-index: 1;
            padding: 28px 28px 48px;
            max-width: 1120px;
            margin: 0 auto;
        }
        .backends-gallery-intro .eyebrow {
            margin: 0 0 6px;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #67e8f9;
            font-weight: 600;
        }
        .backends-gallery-intro h2 {
            margin: 0 0 8px;
            font-size: 28px;
            letter-spacing: -0.03em;
            font-weight: 700;
        }
        .backends-gallery-intro .lede {
            margin: 0 0 22px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.55;
            max-width: 40rem;
        }
        .backend-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .backend-card {
            text-align: left;
            padding: 0;
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 14px;
            background: rgba(24, 27, 33, 0.85);
            overflow: hidden;
            cursor: pointer;
            color: inherit;
            width: 100%;
            opacity: 0;
            transform: translateY(16px);
            animation: cardIn 0.55s ease forwards;
            transition: border-color 0.2s, transform 0.25s, box-shadow 0.25s;
        }
        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0); }
        }
        .backend-card:hover {
            border-color: rgba(56, 189, 248, 0.55);
            transform: translateY(-4px);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        }
        .backend-card-media {
            position: relative;
            height: 140px;
            overflow: hidden;
            background: #0b1220;
        }
        .backend-card-media.hero-mock,
        .backend-hero-media.hero-mock {
            background:
                radial-gradient(ellipse 50% 60% at 30% 40%, rgba(103, 232, 249, 0.35), transparent 55%),
                linear-gradient(135deg, #0c4a6e 0%, #0f172a 55%, #020617 100%);
        }
        .backend-card-media.hero-real,
        .backend-hero-media.hero-real {
            background:
                radial-gradient(ellipse 45% 50% at 70% 30%, rgba(251, 113, 133, 0.28), transparent 55%),
                linear-gradient(135deg, #334155 0%, #1e293b 50%, #0f172a 100%);
        }
        .backend-card-media.hero-fallback img,
        .backend-hero-media.hero-fallback img {
            display: none;
        }
        .backend-card-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.45s ease;
        }
        .backend-card:hover .backend-card-media img { transform: scale(1.05); }
        .backend-card-glow {
            position: absolute;
            inset: -20%;
            background: radial-gradient(circle at 30% 40%, rgba(103, 232, 249, 0.25), transparent 55%);
            animation: glowPulse 4.5s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes glowPulse {
            from { opacity: 0.55; }
            to { opacity: 1; }
        }
        .backend-card-body { padding: 14px 16px 16px; }
        .backend-card-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-start;
        }
        .backend-card-top h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 650;
        }
        .backend-pill {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--muted);
            white-space: nowrap;
        }
        .backend-pill.ready {
            color: #6ee7b7;
            border-color: rgba(16, 185, 129, 0.45);
            background: rgba(16, 185, 129, 0.1);
        }
        .backend-pill.unavailable {
            color: #fca5a5;
            border-color: rgba(248, 113, 113, 0.4);
            background: rgba(248, 113, 113, 0.08);
        }
        .backend-pill.warn {
            color: #fcd34d;
            border-color: rgba(245, 158, 11, 0.4);
        }
        .backend-id {
            display: block;
            margin-top: 6px;
            font-size: 11px;
            color: #94a3b8;
        }
        .backend-desc {
            margin: 10px 0 0;
            font-size: 13px;
            line-height: 1.45;
            color: #cbd5e1;
        }
        .backend-meta {
            margin: 8px 0 0;
            font-size: 12px;
            color: var(--muted);
        }
        .backend-back {
            border: none;
            background: transparent;
            color: #67e8f9;
            cursor: pointer;
            font-size: 13px;
            padding: 0;
            margin-bottom: 16px;
        }
        .backend-back:hover { text-decoration: underline; }
        .backend-hero {
            display: grid;
            grid-template-columns: minmax(200px, 320px) 1fr;
            gap: 20px;
            margin-bottom: 18px;
            align-items: stretch;
        }
        .backend-hero-media {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            min-height: 180px;
            background: #0b1220;
        }
        .backend-hero-media img {
            width: 100%;
            height: 100%;
            min-height: 180px;
            object-fit: cover;
            display: block;
        }
        .backend-hero-copy h2 {
            margin: 8px 0 6px;
            font-size: 26px;
            letter-spacing: -0.02em;
        }
        .backend-hero-copy p {
            margin: 10px 0 0;
            color: var(--muted);
            line-height: 1.5;
            font-size: 14px;
        }
        .backend-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .backend-tabs button {
            background: rgba(15, 17, 21, 0.7);
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 999px;
            padding: 7px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }
        .backend-tabs button:hover { color: var(--text); }
        .backend-tabs button.active {
            color: #e0f2fe;
            border-color: rgba(56, 189, 248, 0.5);
            background: rgba(14, 165, 233, 0.18);
        }
        .backend-overview-dl {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin: 0;
        }
        .backend-overview-dl dt {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin: 0 0 4px;
        }
        .backend-overview-dl dd { margin: 0; font-size: 14px; }
        .backend-warn {
            margin-top: 14px;
            color: #fca5a5;
            font-size: 13px;
        }
        .backend-cta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }
        .backend-cta {
            display: inline-flex;
            align-items: center;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.45);
            background: rgba(14, 165, 233, 0.2);
            color: #e0f2fe;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
        }
        .backend-cta.ghost {
            background: transparent;
            color: var(--muted);
            border-color: var(--border);
        }
        .backend-catalog-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 14px;
            min-height: 420px;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: rgba(15, 17, 21, 0.55);
        }
        .backend-catalog-side {
            border-right: 1px solid var(--border);
            padding: 12px;
            overflow: auto;
            max-height: 70vh;
            background: var(--panel);
        }
        .backend-catalog-detail {
            padding: 16px 20px 32px;
            overflow: auto;
            max-height: 70vh;
        }
        .snap-panel .snap-lede { color: var(--muted); font-size: 13px; line-height: 1.5; }
        .snap-panel .snap-heading { margin: 16px 0 8px; font-size: 15px; }
        .snap-panel .snap-queue {
            margin: 12px 0;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(24, 27, 33, 0.8);
        }
        .snap-panel .snap-queue summary {
            cursor: pointer;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            font-weight: 600;
        }
        .snap-panel .pick-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        .snap-panel .pick-card {
            text-align: left;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #13151a;
            cursor: pointer;
            width: 100%;
            color: inherit;
        }
        .snap-panel .pick-card:hover { border-color: var(--accent); }
        .snap-panel .pick-card h3 { margin: 0 0 6px; font-size: 14px; }
        .snap-panel .meta { font-size: 11px; color: var(--muted); font-family: "JetBrains Mono", monospace; }
        .snap-panel .pin-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #93c5fd;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.35);
            border-radius: 4px;
            padding: 2px 6px;
        }
        .snap-panel .breadcrumb {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--muted);
        }
        .snap-panel .breadcrumb button.linkish {
            border: none;
            background: none;
            color: var(--accent);
            cursor: pointer;
            padding: 0;
            font-size: 13px;
        }
        .snap-panel .breadcrumb .current { color: var(--text); font-weight: 600; }
        .snap-panel .graph-panel {
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 8px;
            background: rgba(20, 24, 32, 0.92);
            overflow: hidden;
            margin-bottom: 12px;
        }
        .snap-panel .graph-panel-head {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 12px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.08);
            font-size: 12px;
            color: var(--muted);
        }
        .snap-panel .control-graph-wrap {
            overflow-x: auto;
            max-height: 160px;
            padding: 6px 8px;
        }
        .snap-panel .pin-detail {
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
            background: #13151a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
        }
        .snap-panel .pin-detail-block { margin-top: 10px; }
        .snap-panel .pin-detail-block h4 {
            margin: 0 0 6px;
            font-size: 11px;
            font-family: Inter, sans-serif;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .snap-panel .pin-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        .snap-panel table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .snap-panel th, .snap-panel td {
            text-align: left;
            padding: 8px 6px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }
    </style>
</head>
<body>
    <div class="wiki-atmosphere" aria-hidden="true"></div>
    <header>
        <div>
            <h1><a href="/" style="color:inherit;text-decoration:none">Cloud Labs</a> · Wiki</h1>
            <p class="sub">Learn the lab language — then explore live backends.</p>
        </div>
        <nav>
            <a href="/twin">Twin UI</a>
            <a href="/operations">Operations</a>
            <a href="/wiki#backends">Backends</a>
            <a href="/wiki" class="active">Wiki</a>
            <a href="/debug" target="_blank">Debugger</a>
        </nav>
    </header>
    <div class="section-bar" id="section-bar" aria-label="Wiki sections"></div>
    <div id="backends-hub" hidden>
        <div class="backends-hub-inner">
            <div id="backends-gallery"></div>
            <div id="backends-detail" hidden></div>
        </div>
    </div>
    <div class="layout">
        <aside class="sidebar">
            <div id="catalog-controls" hidden>
                <div>
                    <label for="backend-select">Backend</label>
                    <select id="backend-select"></select>
                </div>
                <div class="sidebar-tabs">
                    <button type="button" id="tab-components" class="active">Components</button>
                    <button type="button" id="tab-kernels">Kernels</button>
                </div>
            </div>
            <div id="guide-pane">
                <label id="guide-list-label">Chapters</label>
                <div id="guide-list" class="comp-list" style="margin-top:8px">
                    <div class="empty">Loading…</div>
                </div>
            </div>
            <div id="components-pane" hidden>
                <div>
                    <label for="comp-filter">Components</label>
                    <input id="comp-filter" type="search" placeholder="Filter by tag, name, type…" />
                </div>
                <div id="comp-list" class="comp-list" style="margin-top:12px">
                    <div class="empty">Loading…</div>
                </div>
            </div>
            <div id="kernels-pane" hidden>
                <div id="kernel-list" class="comp-list">
                    <div class="empty">Loading…</div>
                </div>
            </div>
        </aside>
        <main id="detail">
            <div class="empty">Loading Wiki…</div>
        </main>
    </div>
    <script type="module" src="/static/js/wiki/dashboard.js"></script>
</body>
</html>
