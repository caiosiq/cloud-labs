<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Component model: parameters, tunables, measurables</title>
  <desc id="desc">A component has parameters (identity), tunables (command and report for the same DOFs), and measurables (observations without a matching tunable).</desc>
  <rect width="720" height="280" fill="#13151a"/>
  <!-- Center component -->
  <rect x="260" y="100" width="200" height="80" rx="10" fill="#181b21" stroke="#3b82f6" stroke-width="1.75"/>
  <text x="360" y="132" text-anchor="middle" fill="#93c5fd" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.06em">COMPONENT</text>
  <text x="360" y="156" text-anchor="middle" fill="#f1f5f9" font-family="JetBrains Mono, monospace" font-size="14">tag_20</text>
  <!-- Parameters -->
  <rect x="40" y="36" width="190" height="72" rx="8" fill="#181b21" stroke="#2a2e36" stroke-width="1.5"/>
  <text x="135" y="62" text-anchor="middle" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Parameters</text>
  <text x="135" y="84" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="12">identity � type � caps</text>
  <line x1="200" y1="108" x2="270" y2="125" stroke="#475569" stroke-width="1.25"/>
  <!-- Tunables -->
  <rect x="490" y="36" width="190" height="72" rx="8" fill="#181b21" stroke="#2a2e36" stroke-width="1.5"/>
  <text x="585" y="58" text-anchor="middle" fill="#60a5fa" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Tunables</text>
  <text x="585" y="76" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">command � ghost</text>
  <text x="585" y="94" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">report � solid</text>
  <line x1="520" y1="108" x2="450" y2="125" stroke="#475569" stroke-width="1.25"/>
  <!-- Measurables -->
  <rect x="265" y="200" width="190" height="56" rx="8" fill="#181b21" stroke="#2a2e36" stroke-width="1.5"/>
  <text x="360" y="224" text-anchor="middle" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Measurables</text>
  <text x="360" y="244" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="12">no 1:1 tunable � capture</text>
  <line x1="360" y1="180" x2="360" y2="200" stroke="#475569" stroke-width="1.25"/>
</svg>
