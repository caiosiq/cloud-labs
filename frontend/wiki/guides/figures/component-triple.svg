<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
  <title id="title">Component model: parameters, tunables, measurables</title>
  <desc id="desc">A component has parameters (identity), tunables (command and report for the same DOFs), and measurables (observations without a matching tunable).</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2129"/>
      <stop offset="100%" stop-color="#14181f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="340" fill="#0a0e14"/>
  <rect width="800" height="340" fill="url(#glow)"/>

  <!-- Center component -->
  <rect x="290" y="118" width="220" height="96" rx="14" fill="url(#panel)" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="152" text-anchor="middle" fill="#7dd3fc" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.12em">COMPONENT</text>
  <text x="400" y="178" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" font-weight="600">tag_20</text>
  <text x="400" y="198" text-anchor="middle" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11">statecontrol · telemetry</text>

  <!-- Parameters -->
  <rect x="36" y="36" width="220" height="100" rx="12" fill="url(#panel)" stroke="#f59e0b" stroke-width="1.75"/>
  <text x="146" y="64" text-anchor="middle" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">Parameters</text>
  <text x="146" y="88" text-anchor="middle" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">identity · type · caps</text>
  <text x="146" y="112" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">catalog — rarely changes</text>
  <path d="M210 120 L290 150" stroke="#f59e0b" stroke-width="1.4" stroke-opacity="0.55" fill="none"/>

  <!-- Tunables -->
  <rect x="544" y="36" width="220" height="100" rx="12" fill="url(#panel)" stroke="#38bdf8" stroke-width="1.75"/>
  <text x="654" y="64" text-anchor="middle" fill="#7dd3fc" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">Tunables</text>
  <text x="654" y="88" text-anchor="middle" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">set via primitives</text>
  <text x="654" y="112" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">ghost = Twin draft UI</text>
  <path d="M590 120 L510 150" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.55" fill="none"/>

  <!-- Measurables -->
  <rect x="250" y="248" width="300" height="72" rx="12" fill="url(#panel)" stroke="#34d399" stroke-width="1.75"/>
  <text x="400" y="278" text-anchor="middle" fill="#6ee7b7" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">Measurables</text>
  <text x="400" y="300" text-anchor="middle" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">no 1:1 tunable · capture / probe</text>
  <path d="M400 214 L400 248" stroke="#34d399" stroke-width="1.4" stroke-opacity="0.55" fill="none"/>
</svg>
