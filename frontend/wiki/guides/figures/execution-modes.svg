<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
  <title id="title">Imperative vs closed-loop execution</title>
  <desc id="desc">Imperative keeps the author in the decision loop over HTTP; closed-loop runs capture-score-actuate on the edge inside an OPTIMIZE job.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2129"/>
      <stop offset="100%" stop-color="#14181f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="340" fill="#0a0e14"/>

  <!-- Left column header -->
  <text x="200" y="36" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Imperative</text>
  <text x="200" y="56" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="12">author in the loop</text>

  <rect x="110" y="76" width="180" height="48" rx="10" fill="url(#panel)" stroke="#38bdf8" stroke-width="2"/>
  <text x="200" y="106" text-anchor="middle" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Laptop decides</text>

  <line x1="200" y1="124" x2="200" y2="148" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="200,152 195,143 205,143" fill="#64748b"/>
  <text x="222" y="142" fill="#64748b" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">HTTP</text>

  <rect x="110" y="156" width="180" height="48" rx="10" fill="url(#panel)" stroke="#38bdf8" stroke-width="1.75"/>
  <text x="200" y="186" text-anchor="middle" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="14">Edge act / sense</text>

  <line x1="200" y1="204" x2="200" y2="228" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="200,232 195,223 205,223" fill="#64748b"/>

  <rect x="110" y="236" width="180" height="48" rx="10" fill="url(#panel)" stroke="#38bdf8" stroke-width="1.75"/>
  <text x="200" y="266" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="13">decide again…</text>

  <text x="200" y="314" text-anchor="middle" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11">one RTT per decision</text>

  <!-- Divider -->
  <line x1="400" y1="48" x2="400" y2="300" stroke="#334155" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- Right column -->
  <text x="600" y="36" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Closed-loop</text>
  <text x="600" y="56" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="12">edge in the loop</text>

  <rect x="510" y="76" width="180" height="44" rx="10" fill="url(#panel)" stroke="#38bdf8" stroke-width="2"/>
  <text x="600" y="104" text-anchor="middle" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Laptop: OPTIMIZE</text>

  <line x1="600" y1="120" x2="600" y2="144" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="600,148 595,139 605,139" fill="#64748b"/>
  <text x="622" y="138" fill="#64748b" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">job</text>

  <rect x="470" y="156" width="260" height="128" rx="14" fill="url(#panel)" stroke="#34d399" stroke-width="2"/>
  <text x="600" y="186" text-anchor="middle" fill="#6ee7b7" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">EDGE INNER LOOP</text>
  <text x="600" y="214" text-anchor="middle" fill="#f1f5f9" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">capture · score · actuate</text>
  <text x="600" y="238" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="12">many iterations locally</text>
  <text x="600" y="262" text-anchor="middle" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11">laptop waits for the result</text>

  <text x="600" y="314" text-anchor="middle" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11">OPTIMIZE owns the long action</text>
</svg>
