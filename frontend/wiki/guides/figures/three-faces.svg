<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Three faces of Cloud Labs</title>
  <desc id="desc">Client SDK and Twin connect over HTTP to the Coordinator, which proxies to the Edge LabCommunicator.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2129"/>
      <stop offset="100%" stop-color="#14181f"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="260" fill="#0a0e14"/>

  <!-- CLIENT — equal accent weight -->
  <rect x="32" y="44" width="200" height="130" rx="14" fill="url(#panel)" stroke="#38bdf8" stroke-width="2"/>
  <text x="132" y="76" text-anchor="middle" fill="#7dd3fc" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.12em">CLIENT</text>
  <text x="132" y="108" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="650">SDK &amp; Twin UI</text>
  <text x="132" y="132" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="12">intent · session lease</text>
  <text x="132" y="154" text-anchor="middle" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11">author laptop</text>

  <!-- arrows client ↔ coordinator -->
  <line x1="232" y1="90" x2="292" y2="90" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="262" y="80" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">HTTP</text>
  <line x1="292" y1="118" x2="232" y2="118" stroke="#64748b" stroke-width="1.35" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="262" y="136" text-anchor="middle" fill="#64748b" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">state</text>

  <!-- COORDINATOR — same stroke weight as client -->
  <rect x="300" y="44" width="200" height="130" rx="14" fill="url(#panel)" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="76" text-anchor="middle" fill="#7dd3fc" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.12em">COORDINATOR</text>
  <text x="400" y="108" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="650">Central server</text>
  <text x="400" y="132" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="12">validate · queue · lease</text>
  <text x="400" y="154" text-anchor="middle" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11">network / this host</text>

  <!-- arrows coordinator ↔ edge -->
  <line x1="500" y1="90" x2="560" y2="90" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="530" y="80" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">proxy</text>
  <line x1="560" y1="118" x2="500" y2="118" stroke="#64748b" stroke-width="1.35" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="530" y="136" text-anchor="middle" fill="#64748b" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">sense</text>

  <!-- EDGE — same stroke weight -->
  <rect x="568" y="44" width="200" height="130" rx="14" fill="url(#panel)" stroke="#38bdf8" stroke-width="2"/>
  <text x="668" y="76" text-anchor="middle" fill="#7dd3fc" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.12em">EDGE</text>
  <text x="668" y="108" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="650">LabCommunicator</text>
  <text x="668" y="132" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="12">cameras · motors · robot</text>
  <text x="668" y="154" text-anchor="middle" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11">bench PC or mock</text>

  <text x="400" y="220" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="12">Three equal faces — client intent, coordinator control plane, edge physics</text>
  <text x="400" y="242" text-anchor="middle" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11">You connect to a backend; you do not pick these roles in your notebook</text>
</svg>
