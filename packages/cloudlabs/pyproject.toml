[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudlabs"
version = "0.1.0"
description = "Cloud Labs imperative Python SDK (HTTP client for leases, jobs, and closed-loop optimize)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Cloud Labs" }]
dependencies = [
  "requests>=2.28.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
kernels = ["torch"]
images = ["numpy>=1.24.0", "Pillow>=9.0.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/cloud-labs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloudlabs = ["py.typed"]
